services:
  db:
    image: postgres:17-alpine
    container_name: velov-db
    environment:
      POSTGRES_USER: velov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: velov
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velov -d velov"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    image: ${IMAGE_NAME:-velov-api}:${MODEL_VERSION:-1.0.0}-${GIT_COMMIT:-dev}
    build:
      context: .
      args:
        MODEL_VERSION: ${MODEL_VERSION:-1.0.0}
        GIT_COMMIT: ${GIT_COMMIT:-dev}
    container_name: velov-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://velov:${POSTGRES_PASSWORD:-secret}@db:5432/velov
    depends_on:
      db:
        condition: service_healthy

  mlflow-db-init:
    image: postgres:17-alpine
    environment:
      PGHOST: db
      PGUSER: velov
      PGPASSWORD: ${POSTGRES_PASSWORD:-secret}
      PGDATABASE: velov
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'mlflow'" | grep -q 1; then
          psql -c "CREATE DATABASE mlflow"
        fi

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    ports:
      - "5000:5000"
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql+psycopg://velov:${POSTGRES_PASSWORD:-secret}@db:5432/mlflow
      - --serve-artifacts
      - --artifacts-destination
      - /mlartifacts
    volumes:
      - mlartifacts:/mlartifacts
    depends_on:
      mlflow-db-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  mlartifacts:
