services:
  db:
    image: postgres:17-alpine
    container_name: velov-db
    environment:
      POSTGRES_USER: velov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: velov
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velov -d velov"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    image: ${IMAGE_NAME:-velov-api}:${MODEL_VERSION:-1.0.0}-${GIT_COMMIT:-dev}
    build:
      context: .
      args:
        MODEL_VERSION: ${MODEL_VERSION:-1.0.0}
        GIT_COMMIT: ${GIT_COMMIT:-dev}
    container_name: velov-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://velov:${POSTGRES_PASSWORD:-secret}@db:5432/velov
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: